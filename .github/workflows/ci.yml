name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 单测只覆盖纯函数，不依赖任何外部包，所以不需要 npm install
      - name: Run unit tests
        run: node --test test/*.test.mjs
